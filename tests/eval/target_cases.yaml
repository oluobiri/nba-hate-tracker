# Ground-truth cases for the sentiment-target verifier eval suite (issue #91).
#
# The verifier answers, for a polar comment, "toward whom is this sentiment
# directed?" - a player or null. Cases are mined from the 2025-26 receipts
# (notebooks/2025-26/07_target_case_mining.ipynb), owner-labeled, and
# nba-superfan-verified. The attributed player is NOT sent to the verifier;
# it is recorded so the control categories can be judged.
#
# Per-case schema (loader: pipeline/targets.py):
#   id                 unique, source-prefixed (receipt- | nullp- | random-)
#   text               comment body sent to the verifier
#   sentiment          pos | neg  (the pass-1 label fed to the prompt)
#   attributed_player  canonical player the pipeline attributed the row to
#   expected_target    canonical player the sentiment is directed at, or null
#   category           see below; the loader enforces its contract on expected_target
#   source             synthetic | mined-v1 | mined-v2
#   comment_id         (optional) Reddit comment id for mined cases
#   note               (optional) context, e.g. why a case is a known miss
#   known_miss         (optional) test is xfail at current baseline
#
# Categories:
#   wrong_player        a different tracked player, identifiable in-text
#   non_player          target is not a tracked player (front office, coach,
#                       refs, media, fans, untracked or retired player) -> null
#   subject_not_target  the attributed player is in the scene as victim, foil,
#                       standard of excellence, beneficiary or bystander, not
#                       as the target -> null
#   true_toward         control: target == attributed_player (classifier named them)
#   readmit_affirm      control: target == attributed_player on a row where the
#                       classifier declined a target (gate-dropped)
#
# Labeling rubric:
#   - A player is the target only if identifiable from the text itself (named,
#     or unambiguously described); an unnamed "him" is null - the verifier must
#     not guess.
#   - A named player is the target if any of the comment's sentiment lands on
#     them, even when a decision-maker is also mocked.
#   - Rejected, not labeled: rows whose pass-1 sentiment the labeler would
#     relabel (sarcasm, banter, neutral report - the target question is
#     undefined; cases.yaml candidates instead); rows whose target is
#     undecidable from the body alone; alias-identity false positives.
#
# Baseline (2026-09-06, 3 runs, claude-haiku-4-5-20251001 @ temp 0, TARGET_PROMPT_VERSION
# v0-draft): true_toward 46/52, readmit_affirm 6/8, non_player 7/10,
# subject_not_target 26/41 (one flaky), wrong_player 1/1; 0 invalid parses after
# the first-object parser fix. Misses are mostly the mention read as the target
# on null-category rows, plus four alias gaps and two guesses at unnamed players.
# Floors: worst run minus one case of slack for categories with >= 5 cases,
# exact otherwise.
# meta.category_floors are minimum accuracy fractions per category.

meta:
  category_floors:
    wrong_player: 1.0
    non_player: 0.6
    subject_not_target: 0.6
    true_toward: 0.86
    readmit_affirm: 0.62
