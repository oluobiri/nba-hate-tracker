# NBA Team Configuration for Flair Normalization
#
# Legacy codes (NJN, MKE, etc.) appear in Reddit flair prefixes like :njn-1:
# and are included as aliases for their current franchise.
#
# Excluded from mapping:
#   - Country flairs (:AUS: Australia, :CAN: Canada, etc.)
#   - Conference flairs (West, East, WC, EC)
#   - League flairs (NBA, r/NBA)
#   - Jersey numbers (23, 24, 15)
#   - Seattle SuperSonics (distinct fanbase from OKC)
#   - Disney bubble hotel flairs (GD, YC, SP8, GFL)
#   - Multi-team flairs (Mavs & Magic)

