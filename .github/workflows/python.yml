name: python

on:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      # The same gate the pre-commit hook runs. Not `ruff format`: the tree
      # is not uniformly format-clean, and not the eval or integration suites.
      - run: uv run ruff check .
      - run: uv run pytest tests/unit/ -q
