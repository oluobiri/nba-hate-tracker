name: web

# Every PR, not only those touching web/: the site is built from the
# published contract, so a pipeline change can break it, and a required
# check that a path filter skips leaves the PR pending forever.
on:
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      # Builds against the published contract, the same bytes a stranger gets.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run walk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: walk
          path: web/walk/out
          if-no-files-found: ignore
