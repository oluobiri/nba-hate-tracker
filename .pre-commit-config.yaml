fail_fast: true
repos:
  - repo: local
    hooks:
      # Python gate: any staged file outside web/ triggers it.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        exclude: ^web/

      - id: pytest
        name: pytest
        entry: uv run pytest tests/unit/ -x --tb=short -q
        language: system
        pass_filenames: false
        exclude: ^web/

      # Web gate: any staged file under web/ triggers it. Build and the
      # Playwright walk run in CI, not here.
      - id: web-check
        name: web check (astro check)
        entry: web/scripts/precommit.sh check
        language: system
        pass_filenames: false
        files: ^web/

      - id: web-lint
        name: web lint (oxlint)
        entry: web/scripts/precommit.sh lint
        language: system
        pass_filenames: false
        files: ^web/

      - id: web-test
        name: web test (vitest)
        entry: web/scripts/precommit.sh test
        language: system
        pass_filenames: false
        files: ^web/
