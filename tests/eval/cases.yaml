# Ground-truth cases for the LLM classifier eval suite (issue #62).
#
# Ported verbatim from VALIDATION_SET in
# notebooks/2024-25/04_cost_analysis.ipynb — the 23-case set the
# production minimal prompt was validated against. Categories follow the
# notebook's grouping.
#
# Per-case schema (loader: pipeline/evaluation.py):
#   id                unique, category-prefixed
#   text              comment body sent to the classifier
#   expected          pos | neg | neu
#   expected_player   canonical player name, or null
#   category          must have an entry in meta.category_floors
#   source            synthetic | mined-v1 | mined-v2
#   comment_id        (optional) Reddit comment id for mined cases
#   note              (optional) context, e.g. why a case is a known miss
#   known_miss        (optional) sentiment test is xfail at current baseline
#   known_miss_player (optional) player-attribution test is xfail
#
# meta.category_floors are minimum sentiment-accuracy fractions per
# category, pinned from the baseline run (see PR for the recorded run).

# Synthetic baseline (2026-07-09, 3 runs, claude-haiku-4-5-20251001 @ temp 0):
# 21/23 sentiment stable-correct; sarcasm-01 stable miss, sarcasm-02
# unstable across runs. Floors: baseline minus one case of slack for
# categories with >=5 cases, exact baseline otherwise.
#
# Mined expansion baseline (2026-07-22, 3 runs, claude-haiku-4-5-20251001
# @ temp 0, ZERO flaky outcomes): 77 mined cases, owner-labeled +
# nba-superfan-verified. Category results: short 18/21, multi_player 5/9,
# sarcasm 5/20 (the ceiling, incl. the tag-intact /s case — classifier
# does not read /s), genuine_praise 29/29 (regression trap armed at a
# perfect baseline). Floors: baseline minus one case of slack for
# categories with >=5 cases, exact baseline otherwise.
#
# v2 prompt freeze (2026-07-24, notebooks/2025-26/06_prompt_experiments):
# /s-hint line adopted; judgment-based sarcasm lines rejected (genuine_praise
# floor fails); slang line unchanged. Against the frozen prompt, 3 runs:
# sarcasm 8/20 stable (02/m07/m19 unflagged), multi-m05 newly unstable
# (flagged), praise-m04 pruned (ruled out 07-15, never removed; 28 cases).
# Floors re-pinned: sarcasm 0.35, multi_player 0.33. Attribution under the
# frozen prompt (pytest caught what 06 §6 didn't measure): short-m04 p now
# stable-correct (unflagged), multi-m05 p unstable (flagged), multi-m18 p
# stably wrong — Dort for Jokic (flagged; item-4 evidence).
meta:
  category_floors:
    clear_positive: 0.8
    clear_negative: 0.83
    neutral: 1.0
    slang_inversion: 1.0
    sarcasm: 0.35
    negative_nickname: 1.0
    short: 0.8
    multi_player: 0.33
    genuine_praise: 0.96

